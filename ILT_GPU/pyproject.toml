[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilt-gpu"
version = "0.1.0"
description = "Differentiable PyTorch Abbe imaging and pixel-based inverse lithography"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pillow>=9",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["ilt_gpu*"]

